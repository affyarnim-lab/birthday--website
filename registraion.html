<!DOCTYPE html>
<html lang="en">
<head>
<title>Guest Registration</title>
<style>
body{
background-color: lightblue
font-family: Arial;
text-align: center;
padding: 40px;
}
.form-box{
background-color: white;
width: 50%;
margin: auto;
padding: 30px;
border-radius: 15px;
}
h1{
color: purple;
}
input, select{
width: 80%
padding: 10px;
margin: 10px;
}
button{
background-color: purple;
color: white;
padding: 12px 25px;
border: none;
border-radius: 8px;
}
</style>
</head>
<body>
<div class="form-box">
<h1>GUEST REGISTRATION.</h1>
<p>Please fill in your information below.</p>
<form action="thankyou.html">
<input type="text" placeholder="Enter your full names" required><br>
<input type="number" placeholder="Enter your age" required"><br>
<select required>
<option value="">Select your gender</option>
<option>Male</option>
<option>Female</option>
</select>
<br>
<input type="tel" placeholder="Enter your phone number" required>
<br>
<button type="submit">Submit Registration</button>
</form>
</div>
</body> 
</html>
